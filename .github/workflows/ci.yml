name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sampleon
          POSTGRES_PASSWORD: sampleon
          POSTGRES_DB: sampleon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sampleon" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://sampleon:sampleon@localhost:5432/postgres
